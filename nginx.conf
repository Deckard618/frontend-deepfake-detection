server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_comp_level 6;

    # Headers for every response. Locations below only use `expires` (never add_header),
    # otherwise nginx would drop these headers there.
    # COOP + COEP make the page cross-origin isolated: ONNX Runtime can then use several threads.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # App shell: always revalidated, so a new deploy is picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # Vite's fingerprinted JS/CSS/WASM never change.
    location /assets/ {
        expires max;
    }

    # Model registry and files: revalidated (ETag) so edited configs apply on the next visit.
    # The app itself keeps model files in Cache Storage per version.
    location /models/ {
        try_files $uri =404;
        expires -1;
    }

    location ~* \.(ico|png|jpe?g|svg|webp)$ {
        expires 7d;
    }
}
